{% extends "base.html" %}
{% block content %}
<form method="post" action="{% if patient %}/patients/{{ patient.id }}{% else %}/patients/new{% endif %}">
	<div class="field">
		<label>First Name</label>
		<input name="first_name" value="{{ patient.first_name if patient }}" required />
	</div>
	<div class="field">
		<label>Last Name</label>
		<input name="last_name" value="{{ patient.last_name if patient }}" required />
	</div>
	<div class="field">
		<label>Date of Birth</label>
		<input type="date" name="dob" value="{{ patient.dob }}" />
	</div>
	<div class="field">
		<label>Phone</label>
		<input name="phone" value="{{ patient.phone if patient }}" />
	</div>
	<div class="field">
		<label>Email</label>
		<input type="email" name="email" value="{{ patient.email if patient }}" />
	</div>
	<div class="field">
		<label>Notes</label>
		<textarea name="notes">{{ patient.notes if patient }}</textarea>
	</div>
	<div class="actions">
		<button class="btn" type="submit">Save</button>
		<a class="btn secondary" href="/patients">Cancel</a>
	</div>
</form>
{% endblock %}
