{% extends "base.html" %}
{% block content %}
<div class="actions">
	<a class="btn" href="/patients/new">New Patient</a>
</div>
<table>
	<thead>
		<tr>
			<th>ID</th>
			<th>First Name</th>
			<th>Last Name</th>
			<th>DOB</th>
			<th>Phone</th>
			<th>Email</th>
			<th></th>
		</tr>
	</thead>
	<tbody>
		{% for p in patients %}
		<tr>
			<td>{{ p.id }}</td>
			<td>{{ p.first_name }}</td>
			<td>{{ p.last_name }}</td>
			<td>{{ p.dob }}</td>
			<td>{{ p.phone }}</td>
			<td>{{ p.email }}</td>
			<td>
				<a class="btn secondary" href="/patients/{{ p.id }}">Edit</a>
				<form method="post" action="/patients/{{ p.id }}/delete" style="display:inline" onsubmit="return confirm('Delete patient?');">
					<button class="btn" type="submit" style="background:#ef4444">Delete</button>
				</form>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
