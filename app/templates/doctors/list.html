{% extends "base.html" %}
{% block content %}
<div class="actions">
	<a class="btn" href="/doctors/new">New Doctor</a>
</div>
<table>
	<thead>
		<tr>
			<th>ID</th>
			<th>First Name</th>
			<th>Last Name</th>
			<th>Specialty</th>
			<th>Phone</th>
			<th>Email</th>
			<th></th>
		</tr>
	</thead>
	<tbody>
		{% for d in doctors %}
		<tr>
			<td>{{ d.id }}</td>
			<td>{{ d.first_name }}</td>
			<td>{{ d.last_name }}</td>
			<td>{{ d.specialty }}</td>
			<td>{{ d.phone }}</td>
			<td>{{ d.email }}</td>
			<td>
				<a class="btn secondary" href="/doctors/{{ d.id }}">Edit</a>
				<form method="post" action="/doctors/{{ d.id }}/delete" style="display:inline" onsubmit="return confirm('Delete doctor?');">
					<button class="btn" type="submit" style="background:#ef4444">Delete</button>
				</form>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
